name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  HUSKY: '0'
  CI: 'true'
  VITE_REMOTE_TODO_URL: https://todo.mfe.nammamedmate.com/mf-manifest.json
  MFE_REPO: ${{ vars.MFE_REPO || 'Iamreyansh/MED0003_MFE' }}

jobs:
  quality:
    name: quality
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  deploy:
    name: deploy
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout portal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: portal
          fetch-depth: 0
          persist-credentials: false
      - name: 'Checkout MED0003 (file deps)'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.MFE_REPO }}
          path: MED0003_MFE
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          package_json_file: portal/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: portal/pnpm-lock.yaml
      - working-directory: portal
        run: pnpm install --frozen-lockfile
      - working-directory: portal
        run: pnpm run build
      - name: Verify build
        working-directory: portal
        run: test -f dist/index.html
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: portal-release-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          role-duration-seconds: 1800
      - name: Sync dist to S3
        working-directory: portal
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          # Versioned release for rollback
          aws s3 sync dist/ "s3://${S3_BUCKET_NAME}/releases/${SHA}/" \
            --delete \
            --only-show-errors \
            --cache-control "public,max-age=31536000,immutable"
          # Live site (hashed assets immutable; HTML/JSON must-revalidate)
          aws s3 sync dist/ "s3://${S3_BUCKET_NAME}/" \
            --delete \
            --only-show-errors \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.json" \
            --exclude "releases/*"
          aws s3 sync dist/ "s3://${S3_BUCKET_NAME}/" \
            --only-show-errors \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" \
            --include "index.html" \
            --include "*.json"
      - name: Invalidate CloudFront
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --no-cli-pager

  post-deploy:
    name: post-deploy
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Post-deployment smoke
        run: |
          chmod +x scripts/post-deploy-smoke.sh
          ./scripts/post-deploy-smoke.sh

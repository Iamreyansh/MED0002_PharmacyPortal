name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: delivery-med0002
  cancel-in-progress: false

env:
  HUSKY: '0'
  CI: 'true'
  MFE_REPO: ${{ vars.MFE_REPO || 'Iamreyansh/MED0003_MFE' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  PROJECT: med0002-pharmacy-portal

jobs:
  quality:
    name: quality
    uses: ./.github/workflows/quality.yml
    secrets:
      MFE_REPO_TOKEN: ${{ secrets.MFE_REPO_TOKEN }}

  e2e:
    name: e2e
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: portal
      - name: Read MED0003 pin
        id: mfe
        working-directory: portal
        run: echo "ref=$(tr -d '[:space:]' < .github/mfe-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.MFE_REPO }}
          ref: ${{ steps.mfe.outputs.ref }}
          path: MED0003_MFE
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}
      - uses: ./portal/.github/actions/setup-portal
      - working-directory: portal
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: portal
        env:
          VITE_SESSION_FIXTURE: owner-free
        run: pnpm run test:e2e

  terraform-staging:
    name: terraform-staging
    needs: [quality]
    uses: ./.github/workflows/terraform.yml
    with:
      environment: staging
      action: apply
    secrets: inherit

  staging:
    name: staging
    needs: [quality, e2e, terraform-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: portal
          persist-credentials: false
      - name: Read MED0003 pin
        id: mfe
        working-directory: portal
        run: echo "ref=$(tr -d '[:space:]' < .github/mfe-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.MFE_REPO }}
          ref: ${{ steps.mfe.outputs.ref }}
          path: MED0003_MFE
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}
      - uses: ./portal/.github/actions/setup-portal
      - working-directory: portal
        run: pnpm run build && test -f dist/index.html
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: portal-staging-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 1800
      - name: Read stack outputs
        id: stack
        run: |
          set -euo pipefail
          PREFIX="/${{ env.PROJECT }}/staging"
          echo "bucket=$(aws ssm get-parameter --name "${PREFIX}/s3_bucket_name" --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(aws ssm get-parameter --name "${PREFIX}/cloudfront_distribution_id" --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          echo "url=$(aws ssm get-parameter --name "${PREFIX}/site_url" --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          echo "suffix=$(aws ssm get-parameter --name "${PREFIX}/mfe_domain_suffix" --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
      - name: Deploy staging
        working-directory: portal
        run: |
          set -euo pipefail
          bash scripts/write-runtime-config.sh /tmp/runtime-config.json "${{ steps.stack.outputs.suffix }}"
          bash scripts/deploy-site.sh \
            "${{ steps.stack.outputs.bucket }}" \
            dist \
            "${GITHUB_SHA}" \
            "${{ steps.stack.outputs.distribution }}" \
            /tmp/runtime-config.json
      - name: Staging smoke
        run: bash portal/scripts/post-deploy-smoke.sh "${{ steps.stack.outputs.url }}/"

  terraform-production:
    name: terraform-production
    needs: [staging]
    uses: ./.github/workflows/terraform.yml
    with:
      environment: production
      action: apply
    secrets: inherit

  production:
    name: production
    needs: [staging, terraform-production]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: portal
          persist-credentials: false
      - name: Read MED0003 pin
        id: mfe
        working-directory: portal
        run: echo "ref=$(tr -d '[:space:]' < .github/mfe-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.MFE_REPO }}
          ref: ${{ steps.mfe.outputs.ref }}
          path: MED0003_MFE
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}
      - uses: ./portal/.github/actions/setup-portal
      - working-directory: portal
        run: pnpm run build && test -f dist/index.html
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: portal-production-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 1800
      - name: Read stack outputs
        id: stack
        run: |
          set -euo pipefail
          PREFIX="/${{ env.PROJECT }}/production"
          echo "bucket=$(aws ssm get-parameter --name "${PREFIX}/s3_bucket_name" --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(aws ssm get-parameter --name "${PREFIX}/cloudfront_distribution_id" --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          echo "url=$(aws ssm get-parameter --name "${PREFIX}/site_url" --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          echo "suffix=$(aws ssm get-parameter --name "${PREFIX}/mfe_domain_suffix" --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          echo "previous=$(aws ssm get-parameter --name "${PREFIX}/current_release_sha" --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
      - name: Deploy production
        working-directory: portal
        run: |
          set -euo pipefail
          bash scripts/write-runtime-config.sh /tmp/runtime-config.json "${{ steps.stack.outputs.suffix }}"
          bash scripts/deploy-site.sh \
            "${{ steps.stack.outputs.bucket }}" \
            dist \
            "${GITHUB_SHA}" \
            "${{ steps.stack.outputs.distribution }}" \
            /tmp/runtime-config.json
      - name: Production smoke
        id: smoke
        continue-on-error: true
        run: bash portal/scripts/post-deploy-smoke.sh "${{ steps.stack.outputs.url }}/"
      - name: Record known-good SHA
        if: steps.smoke.outcome == 'success'
        run: |
          set -euo pipefail
          PREFIX="/${{ env.PROJECT }}/production"
          aws ssm put-parameter --name "${PREFIX}/previous_release_sha" --type String --value "${{ steps.stack.outputs.previous }}" --overwrite
          aws ssm put-parameter --name "${PREFIX}/current_release_sha" --type String --value "${GITHUB_SHA}" --overwrite
      - name: Rollback application artifact
        if: steps.smoke.outcome != 'success'
        env:
          PREV: ${{ steps.stack.outputs.previous }}
        run: |
          set -euo pipefail
          if [ -z "${PREV}" ] || [ "${PREV}" = "unset" ]; then
            echo "::error::Production smoke failed and no previous known-good SHA exists"
            exit 1
          fi
          aws s3 sync "s3://${{ steps.stack.outputs.bucket }}/releases/${PREV}/" "s3://${{ steps.stack.outputs.bucket }}/" \
            --delete \
            --exclude "releases/*" \
            --only-show-errors
          INVALIDATION_ID="$(
            aws cloudfront create-invalidation \
              --distribution-id "${{ steps.stack.outputs.distribution }}" \
              --paths "/index.html" "/runtime-config.json" "/" \
              --query 'Invalidation.Id' \
              --output text \
              --no-cli-pager
          )"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.stack.outputs.distribution }}" \
            --id "${INVALIDATION_ID}"
          bash portal/scripts/post-deploy-smoke.sh "${{ steps.stack.outputs.url }}/"
          echo "::error::Production smoke failed; restored ${PREV}"
          exit 1

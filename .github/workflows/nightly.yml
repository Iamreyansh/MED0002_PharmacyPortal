name: Nightly

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-med0002
  cancel-in-progress: true

env:
  HUSKY: '0'
  CI: 'true'
  MFE_REPO: ${{ vars.MFE_REPO || 'Iamreyansh/MED0003_MFE' }}

jobs:
  federation:
    name: federation-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: portal
      - name: Read MED0003 pin
        id: mfe
        working-directory: portal
        run: echo "ref=$(tr -d '[:space:]' < .github/mfe-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.MFE_REPO }}
          ref: ${{ steps.mfe.outputs.ref }}
          path: MED0003_MFE
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}
      - uses: ./portal/.github/actions/setup-portal
      - working-directory: portal
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: portal
        run: pnpm run test:e2e:federation

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: pnpm fetch --frozen-lockfile && pnpm install --frozen-lockfile --offline
        env:
          HUSKY: '0'
      - run: pnpm audit --audit-level=high

  remote-health:
    name: remote-health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Check production host
        continue-on-error: true
        run: bash scripts/post-deploy-smoke.sh https://pharmacy.nammamedmate.com/
      - name: Check staging host
        continue-on-error: true
        run: bash scripts/post-deploy-smoke.sh https://pharmacy.staging.nammamedmate.com/
      - name: Check MFE manifests
        continue-on-error: true
        run: |
          set -euo pipefail
          for name in auth onboarding pos; do
            url="https://${name}.mfe.nammamedmate.com/mf-manifest.json"
            echo "Health: ${url}"
            curl -fsSL --retry 3 --retry-delay 2 "$url" >/dev/null
          done

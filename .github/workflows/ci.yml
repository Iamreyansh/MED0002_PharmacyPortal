name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  CI: 'true'
  VITE_REMOTE_TODO_URL: https://todo.mfe.nammamedmate.com/mf-manifest.json
  # Override with repo var MFE_REPO if the producer lives elsewhere.
  # For private cross-repo checkout, set secret MFE_REPO_TOKEN (contents:read).
  MFE_REPO: ${{ vars.MFE_REPO || 'Iamreyansh/MED0003_MFE' }}

jobs:
  quality:
    name: quality
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  build:
    name: build
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout portal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: portal
      - name: 'Checkout MED0003 (file deps)'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.MFE_REPO }}
          path: MED0003_MFE
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          package_json_file: portal/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: portal/pnpm-lock.yaml
      - working-directory: portal
        run: pnpm install --frozen-lockfile
      - name: Build Medmate package dists
        working-directory: portal
        run: |
          chmod +x scripts/build-mfe-deps.sh
          ./scripts/build-mfe-deps.sh
      - working-directory: portal
        run: pnpm run build
      - working-directory: portal
        run: test -f dist/index.html

  e2e:
    name: e2e
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout portal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: portal

      - name: 'Checkout MED0003 (file deps + optional local remote)'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.MFE_REPO }}
          path: MED0003_MFE
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          package_json_file: portal/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            portal/pnpm-lock.yaml
            MED0003_MFE/pnpm-lock.yaml

      - name: Install portal
        working-directory: portal
        run: pnpm install --frozen-lockfile

      - name: Build Medmate package dists
        working-directory: portal
        run: |
          chmod +x scripts/build-mfe-deps.sh
          ./scripts/build-mfe-deps.sh

      - name: Install Playwright Chromium
        working-directory: portal
        run: pnpm exec playwright install --with-deps chromium

      - name: Start local todo remote
        id: todo
        working-directory: MED0003_MFE
        continue-on-error: true
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @medmate/todo dev &
          echo $! > /tmp/todo-dev.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5101/mf-manifest.json >/dev/null 2>&1; then
              echo "Todo remote ready"
              echo "url=http://127.0.0.1:5101/mf-manifest.json" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::Local todo remote did not become ready; falling back to production manifest"
          exit 1

      - name: Run e2e
        working-directory: portal
        env:
          VITE_REMOTE_TODO_URL: ${{ steps.todo.outputs.url != '' && steps.todo.outputs.url || 'https://todo.mfe.nammamedmate.com/mf-manifest.json' }}
        run: |
          echo "E2E remote: ${VITE_REMOTE_TODO_URL}"
          pnpm run test:e2e

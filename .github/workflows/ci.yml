name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  CI: 'true'
  VITE_REMOTE_TODO_URL: https://todo.mfe.nammamedmate.com/mf-manifest.json
  # Override with repo var MFE_REPO if the producer lives elsewhere.
  # For private cross-repo checkout, set secret MFE_REPO_TOKEN (contents:read).
  MFE_REPO: ${{ vars.MFE_REPO || 'Iamreyansh/MED0003_MFE' }}

jobs:
  quality:
    name: quality
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  build:
    name: build
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout portal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          path: portal
      - name: 'Checkout MED0003 (file deps)'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          repository: ${{ env.MFE_REPO }}
          path: MED0003_MFE
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          package_json_file: portal/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: portal/pnpm-lock.yaml
      - working-directory: portal
        run: pnpm install --frozen-lockfile
      - name: Build Medmate package dists
        working-directory: portal
        run: |
          chmod +x scripts/build-mfe-deps.sh
          ./scripts/build-mfe-deps.sh
      - working-directory: portal
        run: pnpm run build
      - working-directory: portal
        run: test -f dist/index.html

  e2e:
    name: e2e
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout portal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          path: portal

      - name: 'Checkout MED0003 (file deps + optional local remote)'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          repository: ${{ env.MFE_REPO }}
          path: MED0003_MFE
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          package_json_file: portal/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            portal/pnpm-lock.yaml
            MED0003_MFE/pnpm-lock.yaml

      - name: Install portal
        working-directory: portal
        run: pnpm install --frozen-lockfile

      - name: Build Medmate package dists
        working-directory: portal
        run: |
          chmod +x scripts/build-mfe-deps.sh
          ./scripts/build-mfe-deps.sh

      - name: Install Playwright Chromium
        working-directory: portal
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        working-directory: portal
        env:
          VITE_SESSION_FIXTURE: owner-free
          VITE_REMOTE_POS_URL: http://127.0.0.1:9/mf-manifest.json
        run: pnpm run test:e2e

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  CI: 'true'
  MFE_REPO: ${{ vars.MFE_REPO || 'Iamreyansh/MED0003_MFE' }}

jobs:
  quality:
    name: quality
    uses: ./.github/workflows/quality.yml
    secrets:
      MFE_REPO_TOKEN: ${{ secrets.MFE_REPO_TOKEN }}

  build:
    name: build
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: portal
      - uses: ./portal/.github/actions/checkout-mfe
        with:
          repository: ${{ env.MFE_REPO }}
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}
          ref: ${{ needs.quality.outputs.mfe-ref }}
      - uses: ./portal/.github/actions/setup-portal
      - working-directory: portal
        run: pnpm run build
      - working-directory: portal
        run: test -f dist/index.html && test -f dist/runtime-config.json
      - working-directory: portal
        run: pnpm run check:bundle

  e2e:
    name: e2e
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: portal
      - uses: ./portal/.github/actions/checkout-mfe
        with:
          repository: ${{ env.MFE_REPO }}
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}
          ref: ${{ needs.quality.outputs.mfe-ref }}
      - uses: ./portal/.github/actions/setup-portal
      - working-directory: portal
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: portal
        env:
          VITE_SESSION_FIXTURE: owner-free
        run: pnpm run test:e2e

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VERSION: '1.10.5'
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Format and validate
        working-directory: infra/environments/${{ matrix.environment }}
        run: |
          set -euo pipefail
          terraform fmt -check -recursive ../..
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

  required:
    name: required
    needs: [quality, build, e2e, terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require deterministic gates
        run: |
          set -euo pipefail
          for job in quality build e2e terraform; do
            result="${{ needs.quality.result }}"
            case "$job" in
              quality) result="${{ needs.quality.result }}" ;;
              build) result="${{ needs.build.result }}" ;;
              e2e) result="${{ needs.e2e.result }}" ;;
              terraform) result="${{ needs.terraform.result }}" ;;
            esac
            echo "$job=$result"
            if [ "$result" != "success" ]; then
              echo "::error::$job failed"
              exit 1
            fi
          done

name: Rollback Portal

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to restore
        required: true
        type: choice
        options: [staging, production]
      git_sha:
        description: Previous release git SHA (must exist under s3://…/releases/<sha>/)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: delivery-med0002
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  PROJECT: med0002-pharmacy-portal

jobs:
  rollback:
    name: rollback
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: portal-rollback-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 1800

      - name: Promote previous release
        env:
          SHA: ${{ inputs.git_sha }}
          ENV_NAME: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          PREFIX="/${PROJECT}/${ENV_NAME}"
          BUCKET="$(aws ssm get-parameter --name "${PREFIX}/s3_bucket_name" --query Parameter.Value --output text)"
          DISTRIBUTION="$(aws ssm get-parameter --name "${PREFIX}/cloudfront_distribution_id" --query Parameter.Value --output text)"
          URL="$(aws ssm get-parameter --name "${PREFIX}/site_url" --query Parameter.Value --output text)"
          if ! aws s3 ls "s3://${BUCKET}/releases/${SHA}/index.html" >/dev/null 2>&1; then
            echo "::error::Release ${SHA} not found"
            exit 1
          fi
          aws s3 sync "s3://${BUCKET}/releases/${SHA}/" "s3://${BUCKET}/" \
            --delete \
            --exclude "releases/*" \
            --only-show-errors
          INVALIDATION_ID="$(
            aws cloudfront create-invalidation \
              --distribution-id "${DISTRIBUTION}" \
              --paths "/index.html" "/runtime-config.json" "/" \
              --query 'Invalidation.Id' \
              --output text \
              --no-cli-pager
          )"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${DISTRIBUTION}" \
            --id "${INVALIDATION_ID}"
          echo "url=${URL}" >> "$GITHUB_ENV"
          echo "Rolled back ${ENV_NAME} to ${SHA}"

      - name: Post-rollback smoke
        run: bash scripts/post-deploy-smoke.sh "${url}/"

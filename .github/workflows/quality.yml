name: Quality

on:
  workflow_call:
    secrets:
      MFE_REPO_TOKEN:
        required: false

permissions:
  contents: read

env:
  HUSKY: '0'
  CI: 'true'
  MFE_REPO: ${{ vars.MFE_REPO || 'Iamreyansh/MED0003_MFE' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout portal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: portal
      - name: Read MED0003 pin
        id: mfe
        working-directory: portal
        run: echo "ref=$(tr -d '[:space:]' < .github/mfe-ref)" >> "$GITHUB_OUTPUT"
      - name: Checkout MED0003
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.MFE_REPO }}
          ref: ${{ steps.mfe.outputs.ref }}
          path: MED0003_MFE
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}
      - uses: ./portal/.github/actions/setup-portal
      - name: Format
        working-directory: portal
        run: pnpm run format:check
      - name: Lint
        working-directory: portal
        run: pnpm run lint
      - name: Typecheck
        working-directory: portal
        run: pnpm run typecheck
      - name: Coverage
        working-directory: portal
        run: pnpm run test:coverage

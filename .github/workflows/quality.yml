name: Quality

on:
  workflow_call:
    secrets:
      MFE_REPO_TOKEN:
        required: false
    outputs:
      mfe-ref:
        description: MED0003 commit SHA used for this run
        value: ${{ jobs.quality.outputs.mfe-ref }}

permissions:
  contents: read

env:
  HUSKY: '0'
  CI: 'true'
  MFE_REPO: ${{ vars.MFE_REPO || 'Iamreyansh/MED0003_MFE' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      mfe-ref: ${{ steps.mfe.outputs.sha }}
    steps:
      - name: Checkout portal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: portal
      - name: Checkout MED0003
        id: mfe
        uses: ./portal/.github/actions/checkout-mfe
        with:
          repository: ${{ env.MFE_REPO }}
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}
          ref: ${{ vars.MFE_REF }}
      - uses: ./portal/.github/actions/setup-portal
      - name: Format
        working-directory: portal
        run: pnpm run format:check
      - name: Lint
        working-directory: portal
        run: pnpm run lint
      - name: Typecheck
        working-directory: portal
        run: pnpm run typecheck
      - name: Coverage
        working-directory: portal
        run: pnpm run test:coverage

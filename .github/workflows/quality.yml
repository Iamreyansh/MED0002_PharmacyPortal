# Reusable quality gates for Pharmacy Portal (format / lint / typecheck / coverage).
# Always checks out MED0003 as a sibling so file: @medmate/* deps resolve.
name: Quality

on:
  workflow_call:

permissions:
  contents: read

env:
  HUSKY: '0'
  CI: 'true'
  VITE_MFE_DOMAIN_SUFFIX: mfe.nammamedmate.com
  MFE_REPO: ${{ vars.MFE_REPO || 'Iamreyansh/MED0003_MFE' }}

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout portal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: portal
      - name: 'Checkout MED0003 (file deps)'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.MFE_REPO }}
          path: MED0003_MFE
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          package_json_file: portal/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: portal/pnpm-lock.yaml
      - working-directory: portal
        run: pnpm install --frozen-lockfile
      - working-directory: portal
        run: pnpm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout portal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: portal
      - name: 'Checkout MED0003 (file deps)'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.MFE_REPO }}
          path: MED0003_MFE
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          package_json_file: portal/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: portal/pnpm-lock.yaml
      - working-directory: portal
        run: pnpm install --frozen-lockfile
      - working-directory: portal
        run: pnpm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout portal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: portal
      - name: 'Checkout MED0003 (file deps)'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.MFE_REPO }}
          path: MED0003_MFE
          token: ${{ secrets.MFE_REPO_TOKEN || github.token }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          package_json_file: portal/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: portal/pnpm-lock.yaml
      - working-directory: portal
        run: pnpm install --frozen-lockfile
      - name: Build Medmate package dists
        working-directory: portal
        run: |
          chmod +x scripts/build-mfe-deps.sh
          ./scripts/build-mfe-deps.sh
      - working-directory: portal
        run: pnpm run typecheck
      - working-directory: portal
        run: pnpm run test:coverage

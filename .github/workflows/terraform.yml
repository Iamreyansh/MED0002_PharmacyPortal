name: Terraform

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      action:
        required: true
        type: string
      allow_destroy:
        required: false
        type: boolean
        default: false
    secrets:
      AWS_TF_APPLY_ROLE_ARN:
        required: false
      AWS_TF_PLAN_ROLE_ARN:
        required: false
      AWS_TF_ROLE_ARN:
        required: false
    outputs:
      deploy_role_arn:
        description: GitHub Actions deploy role created by this stack
        value: ${{ jobs.terraform.outputs.deploy_role_arn }}
      site_url:
        description: HTTPS origin for the stack
        value: ${{ jobs.terraform.outputs.site_url }}
  workflow_dispatch:
    inputs:
      environment:
        description: Target stack
        required: true
        type: choice
        options: [staging, production]
      action:
        description: plan or apply
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      allow_destroy:
        description: Allow destroy/replace of protected resources
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VERSION: '1.10.5'
  AWS_REGION: ap-south-1

jobs:
  terraform:
    name: ${{ inputs.action }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Apply uses GitHub environment `terraform` so the existing AWS_TF_ROLE_ARN
    # trust (environment:terraform) works before per-env terraform roles exist.
    environment: ${{ inputs.action == 'apply' && 'terraform' || format('terraform-plan-{0}', inputs.environment) }}
    outputs:
      deploy_role_arn: ${{ steps.outs.outputs.deploy_role_arn }}
      site_url: ${{ steps.outs.outputs.site_url }}
    defaults:
      run:
        working-directory: infra/environments/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ inputs.action == 'apply' && (secrets.AWS_TF_APPLY_ROLE_ARN || secrets.AWS_TF_ROLE_ARN) || (secrets.AWS_TF_PLAN_ROLE_ARN || secrets.AWS_TF_ROLE_ARN) }}
          role-session-name: terraform-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
      - name: Allow staging stack creation
        if: inputs.action == 'apply' && inputs.environment == 'staging'
        working-directory: .
        run: bash scripts/tf-attach-staging-bootstrap-policy.sh
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive ../..
      - name: Init
        run: terraform init -input=false -lockfile=readonly
      - name: Validate
        run: terraform validate
      - name: Plan
        env:
          TF_ALLOW_DESTROY: ${{ inputs.allow_destroy && 'true' || 'false' }}
        run: |
          set -euo pipefail
          terraform plan -input=false -lock-timeout=10m -out=tfplan
          bash ../../../scripts/tf-plan-guard.sh tfplan
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
      - name: Apply saved plan
        if: inputs.action == 'apply'
        run: terraform apply -input=false -lock-timeout=10m tfplan
      - name: Publish stack outputs
        if: inputs.action == 'apply'
        id: outs
        run: |
          set -euo pipefail
          DEPLOY="$(terraform output -raw github_actions_role_arn)"
          TF_ROLE="$(terraform output -raw github_actions_terraform_role_arn)"
          URL="$(terraform output -raw site_url)"
          {
            echo "deploy_role_arn=${DEPLOY}"
            echo "site_url=${URL}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Terraform outputs (${{ inputs.environment }})"
            echo "- deploy role: \`${DEPLOY}\`"
            echo "- terraform role: \`${TF_ROLE}\`"
            echo "- site: ${URL}"
            echo
            echo "Copy the deploy role into GitHub environment \`${{ inputs.environment }}\` as \`AWS_ROLE_ARN\` for deploy and rollback jobs."
          } >> "$GITHUB_STEP_SUMMARY"
